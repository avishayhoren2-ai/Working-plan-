<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="הורנשטיין Horenshteine">
  <defs>
    <clipPath id="disc"><circle cx="160" cy="160" r="155"/></clipPath>
  </defs>

  <!-- Red disc -->
  <circle cx="160" cy="160" r="155" fill="#e8261d"/>

  <g clip-path="url(#disc)">
    <!-- Upper-left white crescent wing (white circle carved by a red circle) -->
    <circle cx="108" cy="108" r="74" fill="#ffffff"/>
    <circle cx="156" cy="156" r="74" fill="#e8261d"/>

    <!-- Lower-right white crescent wing -->
    <circle cx="212" cy="212" r="74" fill="#ffffff"/>
    <circle cx="164" cy="164" r="74" fill="#e8261d"/>

    <!-- Central white S -->
    <text x="160" y="243" text-anchor="middle"
          font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900"
          font-size="250" fill="#ffffff">S</text>

    <!-- Navy banner -->
    <rect x="-2" y="138" width="324" height="48" fill="#163a72"/>

    <!-- Brand name on the banner -->
    <text x="160" y="172" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif" font-weight="800"
          font-size="32" letter-spacing="1" fill="#e8261d">HORENSHTEINE</text>
  </g>

  <!-- Outline ring -->
  <circle cx="160" cy="160" r="153" fill="none" stroke="#c01a14" stroke-width="4"/>
</svg>
