<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="הורנשטיין Horenshteine">
  <defs>
    <clipPath id="circleClip"><circle cx="100" cy="100" r="96"/></clipPath>
  </defs>

  <!-- Red circle -->
  <circle cx="100" cy="100" r="96" fill="#e2231a"/>

  <g clip-path="url(#circleClip)">
    <!-- White S -->
    <text x="100" y="150" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif" font-weight="900"
          font-size="190" fill="#ffffff">S</text>

    <!-- Navy banner -->
    <rect x="-4" y="86" width="208" height="34" fill="#16386e"/>

    <!-- Brand name in red on the banner -->
    <text x="100" y="110" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif" font-weight="800"
          font-size="26" letter-spacing="1" fill="#e2231a">HORENSHTEINE</text>
  </g>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#c81d15" stroke-width="3"/>
</svg>
